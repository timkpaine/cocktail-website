version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'part: github_actions'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    ignore:
      # SvelteKit, svelte-check, and typescript-eslint require TypeScript 6's compiler API.
      - dependency-name: 'typescript'
        versions: ['7.x']
    groups:
      javascript:
        patterns:
          - '*'
    labels:
      - 'lang: javascript'
      - 'part: dependencies'
